name: Build CDRKit

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    # Pull requests from forks to main/master
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
    types: [opened, synchronize, reopened]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcap-dev zlib1g-dev libbz2-dev
      
      - name: Configure and build
        run: |
          mkdir -p build
          cd build
          # Add -fcommon flag to allow multiple definitions of the same variable
          # This fixes the "multiple definition of `outfile'" errors
          cmake .. -DCMAKE_C_FLAGS="-fcommon"
          make
      
      - name: Create package directory
        run: |
          mkdir -p package/cdrkit-ubuntu
          cp build/genisoimage/genisoimage package/cdrkit-ubuntu/
          cp build/icedax/icedax package/cdrkit-ubuntu/
          cp build/wodim/wodim package/cdrkit-ubuntu/
          cp build/readom/readom package/cdrkit-ubuntu/
          
      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cdrkit-ubuntu
          path: package/cdrkit-ubuntu/
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies (if any)
        run: |
          choco install -y cmake make
          # Add any other Windows dependencies here

      - name: Create Build Directory
        run: mkdir build

      - name: Configure CMake
        run: |
          cd build
          cmake ..

      - name: Build
        run: |
          cd build
          make

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir artifacts
          cp -r build/*.exe artifacts/
          # If there are DLLs or other required files, copy them as well

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: cdrkit-windows-build
          path: artifacts
