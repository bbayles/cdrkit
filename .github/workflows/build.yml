name: Build CDRKit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcap-dev zlib1g-dev libbz2-dev
      
      - name: Configure and build
        run: |
          mkdir -p build
          cd build
          cmake ..
          make
      
      - name: Create package directory
        run: |
          mkdir -p package/cdrkit-ubuntu
          cp build/genisoimage/genisoimage package/cdrkit-ubuntu/
          cp build/icedax/icedax package/cdrkit-ubuntu/
          cp build/wodim/wodim package/cdrkit-ubuntu/
          cp build/readom/readom package/cdrkit-ubuntu/
          
      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@v3
        with:
          name: cdrkit-ubuntu
          path: package/cdrkit-ubuntu/
  
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: brew install cmake
      
      - name: Configure and build
        run: |
          mkdir -p build
          cd build
          cmake ..
          make
      
      - name: Create package directory
        run: |
          mkdir -p package/cdrkit-macos
          cp build/genisoimage/genisoimage package/cdrkit-macos/
          cp build/icedax/icedax package/cdrkit-macos/
          cp build/wodim/wodim package/cdrkit-macos/
          cp build/readom/readom package/cdrkit-macos/
      
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v3
        with:
          name: cdrkit-macos
          path: package/cdrkit-macos/
  
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-bzip2
      
      - name: Configure and build
        shell: msys2 {0}
        run: |
          mkdir -p build
          cd build
          cmake .. -G "MSYS Makefiles"
          mingw32-make
      
      - name: Create package directory
        shell: msys2 {0}
        run: |
          mkdir -p package/cdrkit-windows
          cp build/genisoimage/genisoimage.exe package/cdrkit-windows/
          cp build/icedax/icedax.exe package/cdrkit-windows/
          cp build/wodim/wodim.exe package/cdrkit-windows/
          cp build/readom/readom.exe package/cdrkit-windows/
      
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v3
        with:
          name: cdrkit-windows
          path: package/cdrkit-windows/

  create-release:
    needs: [build-ubuntu, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v3
      
      - name: Get version
        id: get_version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT
      
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: dist
      
      - name: Create combined package
        run: |
          mkdir -p combined
          cp -r dist/cdrkit-ubuntu combined/
          cp -r dist/cdrkit-macos combined/
          cp -r dist/cdrkit-windows combined/
          cd combined
          zip -r ../cdrkit-${{ steps.get_version.outputs.VERSION }}-all.zip .
      
      - name: Upload combined artifact
        uses: actions/upload-artifact@v3
        with:
          name: cdrkit-all-platforms
          path: cdrkit-${{ steps.get_version.outputs.VERSION }}-all.zip
