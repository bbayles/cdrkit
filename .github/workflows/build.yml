name: Build CDRKit

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    # Pull requests from forks to main/master
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
    types: [opened, synchronize, reopened]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcap-dev zlib1g-dev libbz2-dev
      
      - name: Configure and build
        run: |
          mkdir -p build
          cd build
          # Add -fcommon flag to allow multiple definitions of the same variable
          # This fixes the "multiple definition of `outfile'" errors
          cmake .. -DCMAKE_C_FLAGS="-fcommon"
          make
      
      - name: Create package directory
        run: |
          mkdir -p package/cdrkit-ubuntu
          cp build/genisoimage/genisoimage package/cdrkit-ubuntu/
          cp build/icedax/icedax package/cdrkit-ubuntu/
          cp build/wodim/wodim package/cdrkit-ubuntu/
          cp build/readom/readom package/cdrkit-ubuntu/
          
      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cdrkit-ubuntu
          path: package/cdrkit-ubuntu/
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            patch
            gzip
            tar

      - name: Build cdrkit
        shell: msys2 {0}
        run: |
          make

      - name: Prepare artifacts
        shell: msys2 {0}
        run: |
            mkdir artifacts
            cp build/mkisofs.exe artifacts/
            cp build/icedax.exe artifacts/
            cp build/cdda2wav.exe artifacts/
            cp build/readom.exe artifacts/
            cp build/xorriso.exe artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cdrkit-windows-binaries
          path: artifacts
